<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn simple Brazilian Jiu-Jitsu concepts, positions, and transitions. Works offline; your data stays on this device." />
    <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201d19" media="(prefers-color-scheme: dark)" />
    <script>
      // Pick the theme before the first paint so a dark device never flashes light. The app corrects it
      // (ui/theme.ts) once it has read the stored choice.
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
    <title>BJJ Fundamentals</title>
    <link rel="apple-touch-icon" href="./artwork/app-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='13' width='28' height='6' rx='2' fill='%23111'/%3E%3Crect x='20' y='13' width='6' height='6' fill='%23c0392b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
